<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Étape 2 - Insertion d'une nouvelle ligne</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="table_container">
        <table aria-label="Liste des personnes">
            <thead>
                <tr>
                    <th scope="col" class="col_number">N°</th>
                    <th scope="col" class="col_text">Nom</th>
                    <th scope="col" class="col_text">Prénom</th>
                    <th scope="col" class="col_number">Points</th>
                    <th scope="col" class="col_chkbox">Select</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col_number">1</td>
                    <td class="col_text">Nom1</td>
                    <td class="col_text">Prénom1</td>
                    <td class="col_number">5</td>
                    <td class="col_chkbox"><input type="checkbox" aria-label="Sélectionner Nom1 Prénom1"></td>
                </tr>
                <tr>
                    <td class="col_number">2</td>
                    <td class="col_text">Nom2</td>
                    <td class="col_text">Prénom2</td>
                    <td class="col_number">5</td>
                    <td class="col_chkbox"><input type="checkbox" aria-label="Sélectionner Nom2 Prénom2"></td>
                </tr>
                <tr>
                    <td class="col_number">3</td>
                    <td class="col_text">Nom3</td>
                    <td class="col_text">Prénom3</td>
                    <td class="col_number">5</td>
                    <td class="col_chkbox"><input type="checkbox" aria-label="Sélectionner Nom3 Prénom3"></td>
                </tr>
            </tbody>
        </table>
        <button type="button" id="btn_add">Ajouter</button>
    </div>
</body>
</html>

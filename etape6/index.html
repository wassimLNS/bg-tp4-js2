<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Étape 6 - CRUD Persons</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="table_container">
        <div id="form_container">
            <div class="form_group">
                <label class="form_label" for="form_nom">Nom :</label>
                <input type="text" id="form_nom" class="form_field" required>
            </div>
            <div class="form_group">
                <label class="form_label" for="form_prenom">Prénom :</label>
                <input type="text" id="form_prenom" class="form_field" required>
            </div>
            <div class="form_group">
                <label class="form_label" for="form_points">Points :</label>
                <input type="number" id="form_points" class="form_field" step="any" required>
            </div>
            <button type="button" id="btn_add" class="btn-add">Ajouter</button>
            <button type="button" id="btn_save" hidden>Enregistrer</button>
            <button type="button" id="btn_cancel" hidden>Annuler</button>
        </div>
        <p id="form_message" role="status" hidden></p>
        <div id="extra_controls">
            <label><input type="checkbox" id="select_all"> Tout sélectionner</label>
            <button type="button" id="btn_edit">Modifier la sélection</button>
            <button type="button" id="btn_sort">Trier par points croissants</button>
        </div>
        <table aria-label="Liste des personnes">
            <thead>
                <tr>
                    <th scope="col" class="col_number">N°</th>
                    <th scope="col" class="col_text">Nom</th>
                    <th scope="col" class="col_text">Prénom</th>
                    <th scope="col" class="col_number">Points</th>
                    <th scope="col" class="col_chkbox">Select</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div id="container_summary" aria-live="polite">
            <p id="p1">0 ligne(s)</p>
            <p id="p2"></p>
            <p id="p3">Total point(s) = 0</p>
        </div>
        <div id="container_btn">
            <button type="button" id="btn_console" class="btn-consol">Console Tableau</button>
            <button type="button" id="btn_delete" class="btn-del">Supprimer</button>
        </div>
    </div>
</body>
</html>
